[package]
name = "sharebox"
version = "0.3.0"
edition = "2021"
description = "Local network task runner with a dashboard and MCP endpoint"
license = "MIT"

[dependencies]
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.140"
libc = "=0.2.155"
getrandom = "=0.2.15"
if-addrs = "=0.15.0"

[profile.release]
lto = true
strip = true

# Native menus without a webview/windowing framework; Linux builds stay headless.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.3"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

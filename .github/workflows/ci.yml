name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Check shell installer
        run: sh -n scripts/install.sh
      - name: Test installer integrity checks offline
        run: sh tests/install.sh
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable build --locked
      - name: Exercise master, worker, and MCP
        env:
          SHAREBOX_BIN: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/e2e.py
      - name: Exercise guided worker setup boundaries
        env:
          SHAREBOX_BIN: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/setup.py
      - name: Exercise verified snapshot upload and execution
        env:
          SHAREBOX_BIN: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/snapshots.py
      - name: Exercise isolated Docker snapshot execution
        if: runner.os == 'Linux'
        env:
          SHAREBOX_DOCKER_IMAGE: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
        run: |
          docker pull "$SHAREBOX_DOCKER_IMAGE"
          python tests/snapshots.py
          python tests/setup.py
      - name: Check native tray initialization
        if: runner.os != 'Linux'
        shell: bash
        run: ./target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }} tray --role master --dashboard http://127.0.0.1:7331 --check
      - name: Exercise native background service lifecycle when a user session is available
        env:
          SHAREBOX_BIN: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/service.py
      - name: Exercise desktop updater validation, restart, and rollback
        if: runner.os != 'Linux'
        env:
          SHAREBOX_BIN: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/update.py
      - name: Exercise independent native updater launch
        if: runner.os != 'Linux'
        env:
          SHAREBOX_TEST_UPDATE_BINARY: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo +stable test --locked --bin sharebox updater::tests::native_helper_launcher -- --ignored --exact --nocapture
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
  browser:
    name: Dashboard browser test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui.mjs
      - run: node tests/setup-ui.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dashboard-test
          path: test-output/
          retention-days: 7
  passed:
    name: CI passed
    if: always()
    needs: [quality, test, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success && test "$BROWSER_RESULT" = success

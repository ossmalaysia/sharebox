name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Check shell installer
        run: sh -n scripts/install.sh
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable build --locked
      - name: Exercise master, worker, and MCP
        env:
          SHAREBOX_BIN: target/debug/sharebox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/e2e.py
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
  passed:
    name: CI passed
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success
